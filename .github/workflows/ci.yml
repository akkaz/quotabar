name: Build and tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo -A apt-get update && sudo -A apt-get install -y gjs gir1.2-adw-1 gir1.2-gtk-4.0 libglib2.0-bin dpkg-dev desktop-file-utils shellcheck rpm
      - name: Check code and installer
        run: |
          /usr/bin/python3 scripts/check.py
          bash -n install.sh
          shellcheck install.sh
          desktop-file-validate packaging/quotabar.desktop
      - name: Build packages
        run: |
          /usr/bin/python3 scripts/build.py
          cd dist
          sha256sum --check SHA256SUMS
      - name: Keep build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quotabar-packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

  fedora-package:
    runs-on: ubuntu-latest
    container: fedora:43
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install native RPM build tools
        run: dnf install -y rpm-build python3 glib2 desktop-file-utils
      - name: Build binary RPM and source RPM from upstream sources
        run: |
          python3 scripts/build.py --format rpm
          cd dist
          sha256sum --check SHA256SUMS
          rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' ./*.noarch.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quotabar-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  fedora-runtime:
    needs: fedora-package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44', '45']
    container: fedora:${{ matrix.fedora }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quotabar-rpm
          path: rpm-artifacts
      - name: Install the native package with DNF
        run: |
          dnf install -y ./rpm-artifacts/*.noarch.rpm
          dnf install -y rpm-build desktop-file-utils dbus-daemon python3-dbusmock mesa-dri-drivers mesa-libEGL shadow-utils util-linux
          rpm -q quotabar
          quotabar --version
      - name: Backend, native preferences imports and installer regressions
        run: python3 scripts/check.py
      - name: Real isolated GNOME panel and popup
        env:
          QUOTABAR_SMOKE_PTYXIS: '1'
        run: |
          # A minimal container has no system bus; GNOME needs one even when
          # its display and session bus are isolated. This lives in the CI container.
          mkdir -p /run/dbus
          dbus-daemon --system --fork --nopidfile
          useradd --create-home quotabar-smoke
          # Only the desktop session/power services are synthetic; the packaged
          # extension, backend, GNOME Shell, GTK and terminal are the real ones.
          python3 -m dbusmock --system --template logind > /tmp/quotabar-logind.log 2>&1 &
          logind_pid=$!
          python3 -m dbusmock --system --template upower > /tmp/quotabar-upower.log 2>&1 &
          upower_pid=$!
          trap 'kill "$logind_pid" "$upower_pid" 2>/dev/null || true' EXIT
          gdbus wait --system --timeout=10 org.freedesktop.login1
          gdbus wait --system --timeout=10 org.freedesktop.UPower
          gdbus call --system --dest org.freedesktop.login1 --object-path /org/freedesktop/login1 --method org.freedesktop.DBus.Mock.AddSession smoke seat0 "$(id -u quotabar-smoke)" quotabar-smoke true
          runuser -u quotabar-smoke -- env XDG_SESSION_ID=smoke bash tests/gnome-smoke.sh
      - name: Uninstall through DNF
        run: |
          dnf remove -y --no-autoremove quotabar
          test ! -e /usr/bin/quotabar
          if test -d /usr/share/gnome-shell/extensions/quotabar@akkaz.dev; then
            find /usr/share/gnome-shell/extensions/quotabar@akkaz.dev -type f
            exit 1
          fi
